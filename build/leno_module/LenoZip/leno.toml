[package]
name = "LenoZip"
version = "0.2.0"
description = "Leno ZIP module: pure-Leno archive read/write (stored write, stored+deflate read)"
authors = ""
license = "Apache-2.0"

[modules]
root = "lib"

# 纯 Leno，无原生库；依赖 LenoCompress（裸 DEFLATE 解压 + CRC32）

# 跨包依赖（import 期校验）：
#   lib/zip_read.leno / lib/zip_write.leno 用 `import "Compress" as z`
[requires]
LenoCompress = ">=0.2.0"
