[package]
name = "LenoSDL3"
version = "0.1.0"
description = "Leno SDL3 绑定模块 - 窗口、渲染器、事件、绘图"

[modules]
root = "lib"

[native-libs.sdl3]
win   = "lib/SDL3.dll"
linux = "lib/SDL3.so"
mac   = "lib/SDL3.so"

[native-libs.sdl3_image]
win   = "lib/SDL3_image.dll"
linux = "lib/SDL3_image.so"
mac   = "lib/SDL3_image.so"

[native-libs.sdl3_ttf]
win   = "lib/SDL3_ttf.dll"
linux = "lib/SDL3_ttf.so"
mac   = "lib/SDL3_ttf.so"
