[package]
name = "LenoMusic"
version = "2.0.0"
description = "Leno audio module (streaming playback) based on miniaudio"
authors = ""
license = "Apache-2.0"

[modules]
root = "lib"

# 原生库：只声明**随包实际分发**的文件（打包时按当前平台键复制到 exe 同目录）。
# 声明了而文件不存在 ⇒ 打包直接报错，故本包未随附的平台不列键。
#
# ★ 2026-11-19 起库文件**按平台分目录**存放（原来是 lib/ 下平铺，与其他模块统一）：
#     lib/win/miniaudio.dll      ← win 键（src/build_dll.bat 产出）
#     lib/linux/miniaudio.so     ← linux 键（src/build_so.sh 产出）
#     lib/android/<abi>/libminiaudio.so  ← 本包暂无产物，**不列键**（见下）
#   分目录的理由：同一模块将来要带 Android 的 ELF（且按 ABI 各一份），
#   平铺目录只能留一个文件名 ⇒ 分平台/ABI 才放得下。
#
# 声明了而文件不存在 ⇒ 打包直接报错；`run_all_tests.leno` 也会据此判定缺库并**静默 SKIP**
#   整个模块 ⇒ 路径写错时汇总只多一个 SKIP，极易当成跑过了。改布局时这里必须同步。
#
# Android 不列键：一个平台键只能指一个路径，装不下 arm64-v8a / x86_64 两份；
#   Android 侧由 android/build_android.sh 直接读 lib/android/<abi>/ 打进 APK 的 lib/<abi>/。
# macOS 不列键：本包没有 macOS 侧产物（lib/linux 里那个 .so 是 Linux ELF，macOS dlopen 必失败）。
#
# 打包时只取**文件名**复制到 exe 同目录（package_install.c 的 collector_add）⇒
#   music_core.leno 的 find_dll() 里"子目录路径失败后退回纯文件名"那一路正是为打包场景准备的。
[native-libs.miniaudio]
win   = "lib/win/miniaudio.dll"
linux = "lib/linux/miniaudio.so"
