[package]
name = "LenoHTTP"
version = "0.2.6"
description = "Leno HTTP/1.1 server on top of sockets (routes, static files, query, forms, thread-pool concurrency)"
authors = ""
license = "Apache-2.0"

[modules]
root = "lib"

# 纯 Leno，无原生库；依赖内置 sockets / files / strings / jsons

# 跨包依赖（import 期校验，不参与 --install）：
#   lib/http_server.leno 用 `import "Compress" as z` 做 gzip 响应
[requires]
LenoCompress = ">=0.2.0"
