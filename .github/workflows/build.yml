name: build

# 三平台构建验证。触发：推送到 main、PR、以及手动触发。
#
# 设计取舍：三个平台**都调用同一个 build.sh**（它自己带 OS/arch 检测与
# 各平台 FFI 源文件选择），Windows 走 MSYS2 MINGW64 而不是 build.bat ——
# 目的是让 .bat / .sh 两条构建路径不至于漂移（历史上正是这种漂移导致
# VM-only 构建链不过）。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    # 上一轮 Windows 任务跑了 25 分钟仍未结束（MSYS2 安装偏慢），
    # 给个上限免得某个任务卡住让整轮 run 永远不结束。
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  name: "Linux x86_64 (gcc)" }
          - { os: windows-latest, name: "Windows x86_64 (MSYS2 MinGW64)" }
          - { os: macos-latest,   name: "macOS arm64" }

    steps:
      - uses: actions/checkout@v4

      # Windows：与 build.bat 同一套 MinGW 工具链（-municode / -lws2_32 / windres）
      - name: 准备 MSYS2 MINGW64
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: mingw-w64-x86_64-gcc

      - name: 工具链（Unix）
        if: runner.os != 'Windows'
        run: |
          uname -s -m
          gcc --version | head -1

      - name: 工具链（Windows / MSYS2）
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          uname -s -m
          gcc --version | head -1

      # 这里刻意用 `./build.sh` 直接执行（而不是 `bash build.sh`）：
      # 顺带守住脚本的**可执行位** —— 从 Windows 提交的 .sh 很容易变成 100644，
      # 那样在 Linux/macOS 上就是 exit 126，而 Windows 本地完全看不出问题。
      - name: 构建编译器 + VM（Unix）
        if: runner.os != 'Windows'
        run: |
          set -o pipefail
          ./build.sh 2>&1 | tee ci_build_sh.log
          ./build_vm.sh 2>&1 | tee ci_build_vm.log

      - name: 构建编译器 + VM（Windows / MSYS2）
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          set -o pipefail
          ./build.sh 2>&1 | tee ci_build_sh.log
          ./build_vm.sh 2>&1 | tee ci_build_vm.log

      - name: 失败时输出构建日志
        if: failure()
        shell: bash
        run: |
          # ① 人读：整段日志进 job summary（在运行页面上直接能看到）
          {
            echo '## 构建失败日志（末尾 120 行）'
            for f in ci_build_sh.log ci_build_vm.log; do
              if [ -f "$f" ]; then
                echo "### $f"
                echo '```'
                tail -n 120 "$f"
                echo '```'
              fi
            done
          } >> "$GITHUB_STEP_SUMMARY"

          # ② 机读：关键错误行单独发成 ::error 注解。
          #    原因：日志归档 /actions/jobs/{id}/logs 需要鉴权；job summary 虽然人读方便，
          #    但实测它**不会**出现在 check-runs API 的 output.summary 里（长度为 0）；
          #    而 workflow command 产生的注解能从 /check-runs/{id}/annotations 免鉴权读到。
          #    这样即使手边没有 token / gh CLI，也能直接看到失败原因 ✓
          n=0
          for f in ci_build_sh.log ci_build_vm.log; do
            if [ -f "$f" ]; then
              while IFS= read -r line; do
                n=$((n + 1))
                if [ "$n" -gt 10 ]; then break 2; fi
                esc=$(printf '%s' "$line" | sed 's/%/%25/g; s/\r//g' | cut -c1-400)
                echo "::error title=$f::${esc}"
              done < <(grep -iE 'error|undefined reference|no such file|cannot find' "$f" | tail -n 10)
            fi
          done

      # 真正的验收：产物能编译并运行一段脚本，而不是只看编译过程有没有报错
      - name: 冒烟测试
        shell: bash
        run: |
          set -e
          BIN=build/leno
          if [ -f build/leno.exe ]; then BIN=build/leno.exe; fi
          printf 'main() {\n    print("Hello, Leno!")\n}\n' > hello_ci.leno
          OUT=$("$BIN" hello_ci.leno)
          echo "脚本输出: $OUT"
          echo "$OUT" | grep -q "Hello, Leno!"
          "$BIN" --version

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: leno-${{ runner.os }}
          if-no-files-found: ignore
          path: |
            build/leno
            build/leno.exe
            build/leno_vm
            build/leno_vm.exe
            build/leno_vm_gui.exe
