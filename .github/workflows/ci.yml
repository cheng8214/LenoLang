name: LenoC CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            git
            mingw-w64-x86_64-gcc

      - name: Build
        run: ./build.sh

      - name: Run tests
        run: ./build/leno.exe assert/run_tests.leno ./build/leno.exe assert

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: leno-windows-x64
          path: build/leno.exe

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y gcc

      - name: Build
        run: ./build.sh

      - name: Run tests
        run: ./build/leno assert/run_tests.leno ./build/leno assert

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: leno-linux-x64
          path: build/leno

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: ./build.sh

      - name: Run tests
        run: ./build/leno assert/run_tests.leno ./build/leno assert

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: leno-macos-x64
          path: build/leno
