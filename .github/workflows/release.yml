name: LenoC Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure CMake
        run: cmake -B build -G "MinGW Makefiles" -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build -j

      - name: Run tests
        run: cmake --build build --target test

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: leno-windows-x64
          path: build/leno.exe

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y gcc cmake libiconv-hook-dev

      - name: Configure CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build -j

      - name: Run tests
        run: cmake --build build --target test

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: leno-linux-x64
          path: build/leno

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build -j

      - name: Run tests
        run: cmake --build build --target test

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: leno-macos-x64
          path: build/leno

  release:
    needs: [build-windows, build-linux, build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: leno-windows-x64
          path: artifacts/

      - uses: actions/download-artifact@v4
        with:
          name: leno-linux-x64
          path: artifacts/

      - uses: actions/download-artifact@v4
        with:
          name: leno-macos-x64
          path: artifacts/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/leno.exe
            artifacts/leno
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
