name: LenoC Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            git
            mingw-w64-x86_64-gcc

      - name: Build
        run: ./build.sh

      - name: Run tests
        run: ./build/leno.exe assert/run_tests.leno ./build/leno.exe assert

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: leno-windows-x64
          path: build/leno.exe

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y gcc

      - name: Build
        run: ./build.sh

      - name: Run tests
        run: ./build/leno assert/run_tests.leno ./build/leno assert

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: leno-linux-x64
          path: build/leno

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: ./build.sh

      - name: Run tests
        run: ./build/leno assert/run_tests.leno ./build/leno assert

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: leno-macos-x64
          path: build/leno

  release:
    needs: [build-windows, build-linux, build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: leno-windows-x64
          path: artifacts/

      - uses: actions/download-artifact@v4
        with:
          name: leno-linux-x64
          path: artifacts/

      - uses: actions/download-artifact@v4
        with:
          name: leno-macos-x64
          path: artifacts/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/leno.exe
            artifacts/leno
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
