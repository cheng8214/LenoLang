# resource.toml — 打包资源配置（独立于 leno.toml，没有 leno.toml 也能用）
#
# [pack] 控制 -p 打包：
#   onefile   = true  → 单文件模式：库与资源内嵌进 exe，首次运行解包到**用户缓存目录**
#                       （按资源内容哈希分子目录；不会污染 exe 所在目录/桌面）
#                       （不加此项时也可用命令行 --onefile 临时开启）
#   resources = 通配模式数组（相对本文件所在目录，声明什么就嵌什么）：
#                 段内 * = 任意长、? = 单字符；单独一段写两个星号 = 跨任意层目录
#                 "images" 段 + 两个星号 ⇒ images 目录递归全部
#   icon      = "app.ico" → 打包产物的**应用图标**换成这个（相对本文件所在目录；
#                 不写则用 VM 自带的默认图标）。两种模式都生效（目录模式 / 单文件）。
#                 只认 .ico；建议里面放多个尺寸（16/24/32/48/256），单尺寸会被系统缩放。
#
# 本应用资源只有 images/（trae_tray.leno 经 dirs.res_dir() 读托盘与菜单图标 ✓）；
# 无控制台开关走命令行 `-p --no-console`（脚本里没有 _console(false)，不做运行期隐藏 ✓）。

[pack]
onefile   = true
resources = ["images/**"]